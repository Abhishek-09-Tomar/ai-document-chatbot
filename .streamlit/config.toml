[theme]
base = "light"
primaryColor = "#137568"
backgroundColor = "#FCFCF9"
secondaryBackgroundColor = "#F0F3EF"
textColor = "#20332F"
font = "sans serif"

[server]
maxUploadSize = 10
maxMessageSize = 2
enableCORS = true
enableXsrfProtection = true
enableAgentApi = false
enableStaticServing = false
disconnectedSessionTTL = 30
allowedHosts = ["localhost", "127.0.0.1", "abhishek-tomar-1-ai-document-chatbot.hf.space"]

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
